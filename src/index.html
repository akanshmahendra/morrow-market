<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Morrow Market | Everyday things, found thoughtfully</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f5ef" />
    <meta
      name="description"
      content="Discover useful, beautiful everyday finds at Morrow Market. Thoughtfully chosen goods for home, beauty and everything in between."
    />
    <link rel="preconnect" href="https://cdn.dummyjson.com" crossorigin />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      const redirectPath = new URLSearchParams(window.location.search).get('p');
      if (redirectPath !== null) {
        const baseHref = document.querySelector('base')?.getAttribute('href') ?? '/';
        window.history.replaceState(null, '', `${baseHref}${redirectPath}`);
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
