<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Morrow Market</title></head>
  <body>
    <script>
      const path = window.location.pathname;
      const productionBase = "/morrow-market/";
      const developmentBase = "/morrow-market/dev/";
      const base = path.startsWith(developmentBase) ? developmentBase : productionBase;
      const route = path.slice(base.length);
      const redirect = route + window.location.search + window.location.hash;
      window.location.replace(base + '?p=' + encodeURIComponent(redirect));
    </script>
  </body>
</html>
