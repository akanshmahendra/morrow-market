name: CI and GitHub Pages

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: morrow-market-pages
  cancel-in-progress: false

jobs:
  validate:
    name: Test and build
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      configuration: ${{ steps.target.outputs.configuration }}
      base_href: ${{ steps.target.outputs.base_href }}
      prod_base_href: ${{ steps.target.outputs.prod_base_href }}
      dev_base_href: ${{ steps.target.outputs.dev_base_href }}
      destination_dir: ${{ steps.target.outputs.destination_dir }}
      site_url: ${{ steps.target.outputs.site_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:coverage

      - name: Select deployment target
        id: target
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repository="${GITHUB_REPOSITORY#*/}"
          target_ref="$GITHUB_REF_NAME"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            target_ref="$GITHUB_BASE_REF"
          fi

          if [[ "$target_ref" == "main" ]]; then
            echo "environment=prod" >> "$GITHUB_OUTPUT"
            echo "configuration=production" >> "$GITHUB_OUTPUT"
            destination_dir="."
            if [[ "$repository" == "$owner.github.io" ]]; then
              base_href="/"
              prod_base_href="/"
              dev_base_href="/dev/"
              site_url="https://${owner}.github.io/"
            else
              base_href="/${repository}/"
              prod_base_href="/${repository}/"
              dev_base_href="/${repository}/dev/"
              site_url="https://${owner}.github.io/${repository}/"
            fi
          elif [[ "$target_ref" == "develop" ]]; then
            echo "environment=dev" >> "$GITHUB_OUTPUT"
            echo "configuration=development" >> "$GITHUB_OUTPUT"
            destination_dir="dev"
            if [[ "$repository" == "$owner.github.io" ]]; then
              base_href="/dev/"
              prod_base_href="/"
              dev_base_href="/dev/"
              site_url="https://${owner}.github.io/dev/"
            else
              base_href="/${repository}/dev/"
              prod_base_href="/${repository}/"
              dev_base_href="/${repository}/dev/"
              site_url="https://${owner}.github.io/${repository}/dev/"
            fi
          else
            echo "Builds must target main or develop." >&2
            exit 1
          fi

          echo "base_href=${base_href}" >> "$GITHUB_OUTPUT"
          echo "prod_base_href=${prod_base_href}" >> "$GITHUB_OUTPUT"
          echo "dev_base_href=${dev_base_href}" >> "$GITHUB_OUTPUT"
          echo "destination_dir=${destination_dir}" >> "$GITHUB_OUTPUT"
          echo "site_url=${site_url}" >> "$GITHUB_OUTPUT"

      - name: Build for GitHub Pages
        run: >-
          npm run build --
          --configuration "${{ steps.target.outputs.configuration }}"
          --base-href "${{ steps.target.outputs.base_href }}"

      - name: Prepare Pages entry point
        shell: bash
        env:
          PROD_BASE_HREF: ${{ steps.target.outputs.prod_base_href }}
          DEV_BASE_HREF: ${{ steps.target.outputs.dev_base_href }}
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, copyFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';

          const clientDir = 'dist/morrow-market/browser';
          const indexHtml = join(clientDir, 'index.html');
          const csrHtml = join(clientDir, 'index.csr.html');
          if (!existsSync(indexHtml) && existsSync(csrHtml)) {
            copyFileSync(csrHtml, indexHtml);
          }
          if (!existsSync(indexHtml)) {
            throw new Error(`Angular browser entry point was not found in ${clientDir}`);
          }

          const productionBase = JSON.stringify(process.env.PROD_BASE_HREF);
          const developmentBase = JSON.stringify(process.env.DEV_BASE_HREF);
          const notFoundHtml = `<!doctype html>
          <html lang="en">
            <head><meta charset="utf-8"><title>Morrow Market</title></head>
            <body>
              <script>
                const path = window.location.pathname;
                const productionBase = ${productionBase};
                const developmentBase = ${developmentBase};
                const base = path.startsWith(developmentBase) ? developmentBase : productionBase;
                const route = path.slice(base.length);
                const redirect = route + window.location.search + window.location.hash;
                window.location.replace(base + '?p=' + encodeURIComponent(redirect));
              </script>
            </body>
          </html>`;
          writeFileSync(join(clientDir, '404.html'), notFoundHtml);
          NODE

      - name: Upload Pages bundle
        uses: actions/upload-artifact@v4
        with:
          name: pages-site
          path: dist/morrow-market/browser
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to ${{ needs.validate.outputs.environment }}
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.validate.outputs.environment }}
      url: ${{ needs.validate.outputs.site_url }}
    permissions:
      contents: write
    steps:
      - name: Download Pages bundle
        uses: actions/download-artifact@v4
        with:
          name: pages-site
          path: site

      - name: Publish site to GitHub Pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          destination_dir: ${{ needs.validate.outputs.destination_dir }}
          keep_files: true
